<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GFM Black Hole Postulation Console · JA21 2.0</title>
<link rel="stylesheet" href="console.css"><script src="console.js" defer></script></head>
<body>
<header class="console-header"><div><span class="brand">GFM <b>/ JA21</b></span><h1>Black hole postulation console</h1></div><div class="health"><span id="instrument-status" role="status">Starting instrument</span><span id="performance-status">Measuring refresh</span></div></header>
<nav aria-label="Research instruments">
<button data-instrument="pulse" aria-pressed="true">01 <span>Pulse · phase · cover</span></button>
<button data-instrument="phase" aria-pressed="false">02 <span>Plasma · material texture</span></button>
<button data-instrument="aperture" aria-pressed="false">03 <span>Aperture / aggie postulation</span></button>
<button data-instrument="kerr" aria-pressed="false">04 <span>Kerr · observations</span></button>
<button data-instrument="equations" aria-pressed="false">05 <span>Equations · source audit</span></button>
<button data-instrument="terminal" aria-pressed="false">06 <span>GFM transform terminal</span></button>
</nav>
<div class="scope-bar"><p id="instrument-scope"></p><a href="combined-project.html" target="_blank" rel="noopener">Model registry &amp; evidence ↗</a></div>
<main><iframe id="instrument" title="GFM research instrument" src="about:blank" allow="fullscreen" ></iframe><div id="load-error" role="alert" hidden></div></main>
</body></html>
